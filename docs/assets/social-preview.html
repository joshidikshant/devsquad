<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Signal over Noise — The Instrument · Night Bench · phosphor #00E5A0
     Tokens lifted verbatim from dikshantjoshi-design styles.css :root.
     To re-render: place Geist-Variable.ttf + GeistMono-Variable.ttf beside
     this file (from the dikshantjoshi-design skill's fonts/), then headless
     Chrome --screenshot at --window-size=1280,640. The .ttf files are render
     inputs, not committed (the PNG bakes the fonts in). */
  @font-face {
    font-family: "Geist Mono";
    src: url("GeistMono-Variable.ttf") format("truetype-variations");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Geist";
    src: url("Geist-Variable.ttf") format("truetype-variations");
    font-weight: 100 900;
  }
  :root {
    --bg: #0A0D0C; --bg-subtle: #0E1210; --surface: #0E1210;
    --fg: #E9EFEA; --fg-muted: #9DACA3; --fg-subtle: #75857B; --fg-faint: #38423D;
    --border: #1E2622; --border-strong: #2C3630;
    --accent: #00E5A0; --accent-fg: #06231A; --accent-dim: #0D2A1F;
    --font-mono: "Geist Mono", ui-monospace, monospace;
    --font-sans: "Geist", system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    background: var(--bg);
    color: var(--fg);
    width: 1280px; height: 640px;
    padding: 64px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
    font-family: var(--font-sans);
  }
  /* faint measurement grid — calibration field, not decoration */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--border-faint, #161C19) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-faint, #161C19) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.5;
  }
  /* the signature move: noise (left) resolving into signal (right) */
  .trace { position: absolute; left: 0; right: 0; top: 300px; height: 120px; z-index: 1; }
  .frame { position: relative; z-index: 2; }

  .eyebrow {
    font-family: var(--font-mono); font-weight: 600;
    font-size: 17px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--accent); display: flex; align-items: center; gap: 12px;
  }
  .led { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }

  h1 {
    font-family: var(--font-mono); font-weight: 600; text-transform: uppercase;
    font-size: 62px; line-height: 1.08; letter-spacing: -1px;
    margin-top: 26px; color: var(--fg);
  }
  h1 .em { color: var(--accent); }

  .sub {
    margin-top: 24px; font-size: 24px; line-height: 1.45; color: var(--fg-muted);
    max-width: 900px; font-weight: 400;
  }
  .sub b { color: var(--fg); font-weight: 500; }

  .bottom { display: flex; align-items: flex-end; justify-content: space-between; }
  .flow { display: flex; align-items: center; gap: 12px; }
  /* role-tag: 1px hairline, sharp corner, border-color = state. NEVER a pill/fill. */
  .tag {
    font-family: var(--font-mono); font-weight: 500; font-size: 19px;
    text-transform: uppercase; letter-spacing: 1px;
    padding: 9px 16px; border: 1px solid var(--border-strong); border-radius: 2px;
    color: var(--fg-muted); background: var(--surface);
  }
  .tag.on { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .arrow { color: var(--fg-faint); font-family: var(--font-mono); font-size: 20px; }

  .readout { text-align: right; font-family: var(--font-mono); }
  .readout .repo {
    font-size: 24px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 2px; color: var(--fg);
  }
  .readout .stat {
    margin-top: 8px; font-size: 16px; color: var(--fg-subtle); letter-spacing: 0.5px;
  }
  .readout .stat .g { color: var(--accent); }
</style>
</head>
<body>
  <div class="grid"></div>
  <svg class="trace" viewBox="0 0 1280 120" preserveAspectRatio="none">
    <!-- noise on the left dissolving into a clean phosphor signal on the right -->
    <polyline fill="none" stroke="#38423D" stroke-width="1.5" opacity="0.55"
      points="0,60 24,38 40,82 58,30 74,90 96,44 116,74 138,34 160,86 184,52 208,70 232,46 260,66 290,54 320,62 355,58 395,60 440,60" />
    <polyline fill="none" stroke="#00E5A0" stroke-width="2.5"
      points="440,60 500,60 540,26 580,94 620,60 700,60 760,60 800,30 840,90 880,60 1000,60 1080,60 1120,44 1160,76 1200,60 1280,60" />
  </svg>

  <div class="frame">
    <div class="eyebrow"><span class="led"></span> Claude Code Plugin · Signal over Noise</div>
    <h1>Your AI agent ignores<br>your rules. <span class="em">Hooks don't.</span></h1>
    <div class="sub">Intercepts tool calls, routes the grunt work across three CLIs, then <b>A/B-tests whether delegation actually saves you tokens.</b></div>
  </div>

  <div class="frame bottom">
    <div class="flow">
      <span class="tag">Gemini</span>
      <span class="arrow">·</span>
      <span class="tag">Codex</span>
      <span class="arrow">·</span>
      <span class="tag">Grok</span>
      <span class="arrow">→</span>
      <span class="tag on">Claude decides</span>
    </div>
    <div class="readout">
      <div class="repo">DevSquad</div>
      <div class="stat"><span class="g">177 TESTS PASSING</span> · BASH 3.2+ · MIT</div>
    </div>
  </div>
</body>
</html>
